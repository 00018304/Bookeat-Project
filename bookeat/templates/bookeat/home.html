{% load static %}
<!doctype html><html><head><meta charset="utf-8"><title>BookEat</title>
<link rel="stylesheet" href="{% static 'bookeat/css/style.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body>
<header class="site-header">
<div class="container d-flex justify-content-between align-items-center py-3">
  <h1 class="brand">BookEat</h1>
  <nav>
    {% if user.is_authenticated %}
      <a href="{% url 'bookeat:reservations_list' %}" class="btn btn-light">My reservations</a>
      <a href="/admin/logout/" class="btn btn-outline-light">Logout</a>
    {% else %}
      <a href="/admin/login/" class="btn btn-light">Login</a>
      <a href="{% url 'bookeat:register' %}" class="btn btn-outline-light">Register</a>
    {% endif %}
  </nav>
</div>
</header>
<main class="container mt-5">
<h2>Top restaurants in Tashkent</h2>
<div class="row">
  {% for r in restaurants %}
  <div class="col-md-4">
    <div class="card restaurant-card mb-4">
      <div class="card-body">
        <h5 class="card-title">{{ r.name }}</h5>
        <p class="card-text">{{ r.address }}</p>
        <a href="{% url 'bookeat:restaurant_detail' r.pk %}" class="btn btn-pink">View Menu</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
</main></body></html>
