{% load static %}
<!doctype html><html><head><meta charset="utf-8"><title>{{ restaurant.name }} - Menu</title>
<link rel="stylesheet" href="{% static 'bookeat/css/style.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body>
<div class="container py-4">
  <a href="{% url 'home' %}" class="btn btn-link">&larr; Back</a>
  <h1>{{ restaurant.name }}</h1>
  <p>{{ restaurant.description }}</p>
  <h3>Menu</h3>
  <div class="list-group">
    {% for m in meals %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
      <div><strong>{{ m.name }}</strong> {% if m.is_drink %}<em>(drink)</em>{% endif %}</div>
      <div><span>{{ m.price }}</span></div>
    </div>
    {% endfor %}
  </div>
  <a href="{% url 'bookeat:reservation_create' %}" class="btn btn-pink mt-4">Make a reservation</a>
</div></body></html>
