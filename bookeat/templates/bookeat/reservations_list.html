{% load static %}
<!doctype html><html><head><meta charset="utf-8"><title>My Reservations</title>
<link rel="stylesheet" href="{% static 'bookeat/css/style.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body>
<div class="container py-4">
  <h1>My Reservations</h1>
  <a href="{% url 'bookeat:reservation_create' %}" class="btn btn-pink mb-3">Create reservation</a>
  <ul class="list-group">
    {% for r in reservations %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div><strong>{{ r.restaurant.name }}</strong><br>{{ r.datetime }} | Guests: {{ r.guests }}</div>
      <div><a href="{% url 'bookeat:reservation_edit' r.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
      <a href="{% url 'bookeat:reservation_delete' r.pk %}" class="btn btn-sm btn-danger">Delete</a></div>
    </li>
    {% empty %}<li class="list-group-item">No reservations yet.</li>{% endfor %}
  </ul></div></body></html>
